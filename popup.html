<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet AI Translator — Cài đặt</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <span class="popup-logo">🌐</span>
      <div>
        <h1 class="popup-title">Meet AI Translator</h1>
        <p class="popup-subtitle">Dịch caption Google Meet theo thời gian thực</p>
      </div>
    </div>

    <!-- Settings Form -->
    <form id="settings-form">
      <!-- API Key -->
      <div class="form-group">
        <label for="api-key">Gemini API Key</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="api-key"
            placeholder="Nhập API key của bạn..."
            autocomplete="off"
          />
          <button type="button" id="toggle-key" class="icon-btn" title="Hiện/Ẩn">👁</button>
        </div>
        <p class="form-hint">
          Lấy API key tại <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>
        </p>
      </div>

      <!-- Target Language -->
      <div class="form-group">
        <label for="target-lang">Ngôn ngữ đích</label>
        <select id="target-lang">
          <option value="vi">🇻🇳 Tiếng Việt</option>
          <option value="en">🇺🇸 English</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="es">🇪🇸 Español</option>
          <option value="th">🇹🇭 ภาษาไทย</option>
        </select>
      </div>

      <!-- Save Button -->
      <button type="submit" id="save-btn" class="save-btn">
        Lưu cài đặt
      </button>

      <!-- Status Message -->
      <div id="status-msg" class="status-msg"></div>
    </form>

    <!-- Footer -->
    <div class="popup-footer">
      <span>v1.0</span>
      <span>•</span>
      <span>Powered by Gemini</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
